services:
  proxmobile:
    build:
      context: .
      dockerfile: Dockerfile
    image: proxmobile:latest
    container_name: proxmobile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PROXMOX_DEFAULT_HOST=${PROXMOX_DEFAULT_HOST:-}
      - PROXMOX_DEFAULT_REALM=${PROXMOX_DEFAULT_REALM:-pam}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
